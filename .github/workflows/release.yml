name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install git-cliff
        uses: taiki-e/install-action@9e1e5806d4a4822de933115878265be9aaa786d9 # v2
        with:
          tool: git-cliff

      - name: Bump package.json version
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e "const p=require('./package.json'); p.version=process.env.PACKAGE_VERSION; require('fs').writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n')"

      - name: Generate CHANGELOG
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: git-cliff --config cliff.toml --tag "$TAG_NAME" --output CHANGELOG.md

      - name: Extract release notes
        id: notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git-cliff --config cliff.toml --latest --strip all --output "$RUNNER_TEMP/release-notes.md"
          DELIMITER="PAYABLE_RELEASE_NOTES_$(openssl rand -hex 16)"
          {
            printf 'body<<%s\n' "$DELIMITER"
            cat "$RUNNER_TEMP/release-notes.md"
            printf '\n%s\n' "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

      - name: Commit release metadata
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          DEFAULT_BRANCH="$(git remote show origin | sed -n 's/.*HEAD branch: //p')"
          git config user.name "$(git show -s --format='%an' HEAD)"
          git config user.email "$(git show -s --format='%ae' HEAD)"
          git add CHANGELOG.md package.json
          if git diff --cached --quiet; then
            echo "No release metadata changes."
          else
            git commit -m "chore(changelog): ${TAG_NAME}"
            git push origin "HEAD:${DEFAULT_BRANCH}"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [ "${TAG_NAME#*-}" != "$TAG_NAME" ]; then
            RELEASE_FLAG="--prerelease"
          else
            RELEASE_FLAG="--latest"
          fi
          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "${RELEASE_FLAG}"

      - name: Send GitHub Release to Discord
        if: ${{ env.DISCORD_WEBHOOK != '' }}
        uses: SethCohen/github-releases-to-discord@24d166886aee4646d448c8a389ff9e1ebcab3682 # v1.20.0
        with:
          webhook_url: ${{ env.DISCORD_WEBHOOK }}
          release_name: ${{ github.ref_name }}
          release_body: ${{ steps.notes.outputs.body }}
          release_html_url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
          color: "8150256"
          username: "Payable Releases"
          footer_title: "@akira-io/payable"
          footer_timestamp: true
