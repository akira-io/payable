name: publish

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Verify tagged release metadata
        run: node scripts/verify-release-metadata.mjs "$GITHUB_REF_NAME"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Verify bundle
        run: bun run verify:bundle

      - name: Verify dist exports
        run: bun run verify:exports

      - name: Smoke packed package consumers
        run: node scripts/smoke-package-consumer.mjs

      - name: Verify beta7 to beta8 upgrades
        run: bunx vitest run tests/beta-upgrade-smoke.test.ts

      - name: Check if version already published
        id: version_check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "Already published: $NAME@$VER"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.version_check.outputs.skip != 'true'
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          TAG=$(node scripts/select-npm-publish-tag.mjs "$VER")
          echo "Publishing $NAME@$VER with dist-tag $TAG"
          npx -y npm@11 publish --access public --provenance --tag "$TAG"
